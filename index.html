<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Food Express - Login</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Quicksand', sans-serif;
      background: url('https://png.pngtree.com/background/20230528/original/pngtree-an-arrangement-of-various-indian-food-picture-image_2778221.jpg') no-repeat center center fixed;
      background-size: cover;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.6);
      z-index: -1;
    }

    .overlay {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .form-container {
      background: #f5e4d7;
      padding: 35px;
      border-radius: 20px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 400px;
      transition: transform 0.3s ease;
    }

    .form-container:hover {
      transform: scale(1.01);
    }

    h2 {
      text-align: center;
      margin-bottom: 10px;
      color: #2c2c2c;
      font-weight: 700;
    }

    h3 {
      text-align: center;
      margin-bottom: 25px;
      color: #444;
      font-weight: 500;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: #2c2c2c;
      font-weight: 500;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 4px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 15px;
      font-family: 'Quicksand', sans-serif;
    }

    .error {
      color: red;
      font-size: 12px;
      margin-bottom: 8px;
      display: none;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #333333;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.3s ease;
    }

    button:hover {
      background-color: #1f1f1f;
    }
  </style>
</head>
<body>

  <div class="overlay">
    <div class="form-container">
      <h2>Food Express</h2>
      <h3>Login</h3>

      <!-- ✅ Form with event -->
      <form id="loginForm" onsubmit="return storeUserData(event)">
        <label for="name">Your Name</label>
        <input type="text" id="name" name="name" placeholder="Enter your name" required />
        <div id="nameError" class="error">Invalid name. Only letters and spaces allowed.</div>

        <label for="mobile">Mobile Number</label>
        <input type="tel" id="mobile" name="mobile" placeholder="Enter your mobile number" required />
        <div id="mobileError" class="error">Invalid phone number. Must be 10 digits.</div>

        <label for="place">Your Place</label>
        <input type="text" id="place" name="place" placeholder="Where are you residing?" required />

        <button type="submit">Continue</button>
      </form>
    </div>
  </div>

  <script>
    function storeUserData(event) {
      event.preventDefault(); // ✅ Stops normal form submit

      // Get form values
      const name = document.getElementById('name').value.trim();
      const mobile = document.getElementById('mobile').value.trim();
      const place = document.getElementById('place').value.trim();

      // Error elements
      const nameError = document.getElementById('nameError');
      const mobileError = document.getElementById('mobileError');

      // Validation flags
      let isValid = true;

      // ✅ Validate name
      if (!/^[A-Za-z ]+$/.test(name)) {
        nameError.style.display = 'block';
        isValid = false;
      } else {
        nameError.style.display = 'none';
      }

      // ✅ Validate mobile
      if (!/^\d{10}$/.test(mobile)) {
        mobileError.style.display = 'block';
        isValid = false;
      } else {
        mobileError.style.display = 'none';
      }

      if (!isValid) return false;

      // ✅ Send to backend
      fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, mobile, place })
      })
      .then(res => res.json())
      .then(data => {
        console.log('✅ Server response:', data);
        if (data.success) {
          window.location.href = 'home.html';
        } else {
          alert('Login failed.');
        }
      })
      .catch(err => {
        console.error('❌ Fetch error:', err);
        alert('Something went wrong.');
      });

      return false; // Prevent default
    }
  </script>

</body>
</html>
