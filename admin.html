<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f7f7f7;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #333;
      color: white;
      text-align: center;
      padding: 15px;
      font-size: 24px;
    }
    .container {
      padding: 20px;
    }
    .btn-back {
      background-color: #007bff;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn-back:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <header>Admin Dashboard</header>

  <div class="container">
    <p>Welcome, Admin! Here you can manage menu items, view orders, and track deliveries.</p>

    <button class="btn-back" onclick="window.location.href='home.html'">🏠 Back to Menu</button>
  </div>

</body>
</html>
